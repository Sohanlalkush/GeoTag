<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" />

  <!-- Camera Body Outline -->
  <rect x="76" y="130" width="360" height="270" rx="44" fill="#1e293b" stroke="#334155" stroke-width="8" filter="url(#glow)"/>
  
  <!-- Camera Top Bar / Flash / Viewfinder -->
  <path d="M180 130 L200 90 L312 90 L332 130 Z" fill="#334155" />
  <circle cx="370" cy="180" r="16" fill="#f59e0b" opacity="0.9" />

  <!-- Camera Lens Outer Ring -->
  <circle cx="256" cy="270" r="92" fill="#0f172a" stroke="#475569" stroke-width="6" />
  <circle cx="256" cy="270" r="76" fill="url(#lensGrad)" />
  <circle cx="256" cy="270" r="60" fill="#020617" opacity="0.85" />
  <circle cx="236" cy="250" r="18" fill="#ffffff" opacity="0.25" />

  <!-- Location Pin Overlay -->
  <g transform="translate(256, 270) scale(1.15)" filter="url(#glow)">
    <path d="M0 -70 C-26 -70 -46 -50 -46 -24 C-46 14 0 54 0 54 C0 54 46 14 46 -24 C46 -50 26 -70 0 -70 Z" fill="url(#pinGrad)" stroke="#ffffff" stroke-width="4"/>
    <circle cx="0" cy="-24" r="15" fill="#ffffff" />
    <circle cx="0" cy="-24" r="7" fill="#ef4444" />
  </g>

  <!-- Subtle GPS Grid / Satellite Rings -->
  <circle cx="256" cy="270" r="130" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="8 8" opacity="0.4" />
  <circle cx="256" cy="270" r="160" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="12 12" opacity="0.2" />
</svg>
